name: Bug report
description: Something is broken or behaves differently than documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please check the existing issues first, and do not report security vulnerabilities here. See the security policy instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact error message or output if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version are you using?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime version, and anything else relevant.
  - type: checkboxes
    id: human-review
    attributes:
      label: Human review
      options:
        - label: I have personally reviewed and submitted this report. It is not an unattended AI-generated submission.
          required: true
